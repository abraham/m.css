name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  size:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - run: node scripts/size.ts

  # The container image must match @playwright/test, so Dependabot's npm bump also moves the image.
  playwright:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: |
          version=$(jq -r '.devDependencies["@playwright/test"]' package.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Pin @playwright/test to an exact version, not $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Same image as `npm run test:visual`, so screenshots match the committed baselines.
  browser:
    needs: playwright
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    env:
      # Firefox refuses to run as root when HOME is owned by another user.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npx playwright test --project=${{ matrix.browser }} tests/visual.spec.ts tests/motion.spec.ts tests/layout.spec.ts tests/forms.spec.ts tests/demo.spec.ts
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/

  a11y:
    needs: playwright
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npx playwright test --project=chromium tests/a11y.spec.ts
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report-a11y
          path: |
            playwright-report/
            test-results/

  # The only required status check: fails when any job above failed or was cancelled.
  ci-required:
    if: ${{ !cancelled() }}
    needs: [lint, typecheck, build, size, playwright, browser, a11y]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
