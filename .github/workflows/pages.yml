name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: deploy-github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build
      # demo/ is self-contained (the build copies modern.css into demo/dist), so it deploys as the site root.
      # The old /demo/ address redirects to the root.
      - run: |
          cp -R demo _site
          mkdir _site/demo
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=../"><title>modern.css</title><a href="../">modern.css demo</a>\n' > _site/demo/index.html
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
