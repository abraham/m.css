name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish, but skip queued ones superseded by a newer push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      # demo/ is self-contained (the build copies m.css into demo/dist), so it deploys as the site root.
      # The old /demo/ address redirects to the root.
      - run: |
          cp -R demo _site
          mkdir _site/demo
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=../"><title>m.css</title><a href="../">m.css demo</a>\n' > _site/demo/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
